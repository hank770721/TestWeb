<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>祈願天燈</title>
    <style>
      :root {
        --sky-top: #070d1d;
        --sky-mid: #0d1630;
        --sky-bottom: #02070f;
        --glass-bg: rgba(25, 31, 48, 0.42);
        --glass-border: rgba(218, 227, 255, 0.34);
        --text: #edf4ff;
        --muted: rgba(237, 244, 255, 0.72);
        --paper: #fff7d9;
        --paper-soft: #f4d98f;
        --paper-warm: #e9b76e;
        --ink: rgba(58, 32, 18, 0.8);
        --gold: #ffd35a;
        --red: #d94343;
        --red-deep: #a71d2a;
        --flame: #ffbf52;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
        background: linear-gradient(180deg, var(--sky-top), var(--sky-mid) 45%, var(--sky-bottom));
        color: var(--text);
      }

      body {
        min-height: 100vh;
      }

      .scene {
        position: relative;
        width: 100%;
        height: 100vh;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 10%, rgba(158, 176, 255, 0.18), transparent 32%),
          radial-gradient(circle at 70% 18%, rgba(180, 200, 255, 0.08), transparent 24%),
          linear-gradient(180deg, var(--sky-top), var(--sky-mid) 42%, var(--sky-bottom));
      }

      .stars {
        position: absolute;
        inset: 0;
        z-index: 0;
      }

      .star {
        position: absolute;
        display: block;
        border-radius: 50%;
        background: rgba(255,255,255,0.9);
        box-shadow: 0 0 8px rgba(255,255,255,0.8);
        animation: twinkle var(--duration) ease-in-out infinite;
        animation-delay: var(--delay);
      }

      @keyframes twinkle {
        0%, 100% { transform: scale(0.72); opacity: 0.35; }
        50% { transform: scale(1.8); opacity: 1; }
      }

      .lantern-bg {
        position: absolute;
        left: var(--x);
        top: var(--y);
        width: var(--size);
        height: calc(var(--size) * 1.7);
        z-index: 1;
        pointer-events: none;
        animation: lantern-sway var(--duration) ease-in-out infinite alternate;
        opacity: 0.76;
      }

      .lantern-bg::before {
        content: "";
        position: absolute;
        left: 50%;
        top: -18px;
        width: 2px;
        height: 22px;
        transform: translateX(-50%);
        background: linear-gradient(180deg, rgba(255,255,255,0.18), rgba(171,188,255,0.7));
      }

      .lantern-bg::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: -6px;
        width: 12px;
        height: 12px;
        transform: translateX(-50%);
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #fff4b7 0%, var(--flame) 26%, #ff9a36 60%, rgba(255,157,54,0.7) 100%);
        box-shadow: 0 0 18px rgba(255, 180, 70, 0.7), 0 0 26px rgba(255, 151, 66, 0.6);
      }

      .lantern-shape {
        position: absolute;
        inset: 0;
        border-radius: 46% 46% 42% 42% / 28% 28% 62% 62%;
        background: linear-gradient(180deg, #fff9d7 0%, #f6dd8f 22%, #f1bc63 52%, #df8a41 100%);
        border: 1px solid rgba(255, 245, 200, 0.9);
        box-shadow: inset 0 0 18px rgba(255,255,255,0.26), 0 8px 20px rgba(255,186,77,0.18);
        clip-path: polygon(15% 0%, 85% 0%, 100% 12%, 96% 100%, 4% 100%, 0% 12%);
      }

      .lantern-shape::before,
      .lantern-shape::after {
        content: "";
        position: absolute;
        top: 16%;
        width: 18%;
        height: 50%;
        border-radius: 50%;
        background: rgba(255,255,255,0.22);
      }

      .lantern-shape::before { left: 16%; }
      .lantern-shape::after { right: 16%; }

      .lantern-bg .ribs {
        position: absolute;
        inset: 12px 10px 20px;
        border-radius: 48% 48% 50% 50% / 32% 32% 68% 68%;
        background:
          radial-gradient(circle at center, rgba(255,255,255,0.18) 0%, transparent 58%),
          repeating-linear-gradient(
            90deg,
            rgba(166, 97, 28, 0.08) 0,
            rgba(166, 97, 28, 0.08) 2px,
            rgba(255,255,255,0) 2px,
            rgba(255,255,255,0) 8px
          );
      }

      @keyframes lantern-sway {
        0% { transform: translate3d(0,0,0) rotate(-4deg) scale(var(--scale, 1)); }
        100% { transform: translate3d(18px,-8px,0) rotate(4deg) scale(var(--scale, 1)); }
      }

      .wish-form-wrap {
        position: absolute;
        left: 50%;
        bottom: 28px;
        transform: translateX(-50%);
        z-index: 5;
        width: min(760px, calc(100% - 28px));
      }

      form {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
      }

      .glass-field {
        position: relative;
        flex: 1;
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        border-radius: 18px;
        box-shadow: 0 14px 34px rgba(12,18,34,0.28), inset 0 1px 10px rgba(255,255,255,0.08);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
      }

      input {
        width: 100%;
        border: none;
        outline: none;
        background: transparent;
        color: var(--text);
        font-size: clamp(1rem, 1.4vw, 1.15rem);
        padding: 18px 20px;
        border-radius: 18px;
      }

      input::placeholder {
        color: var(--muted);
      }

      .submit-btn {
        position: relative;
        border: none;
        border-radius: 18px;
        background: linear-gradient(135deg, rgba(255,214,111,0.98), rgba(188,128,255,0.9));
        color: #1e1d2a;
        font-weight: 700;
        letter-spacing: 0.08em;
        padding: 18px 24px;
        min-width: 160px;
        cursor: pointer;
        box-shadow: 0 12px 24px rgba(147,118,255,0.28);
        transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
      }

      .submit-btn:hover {
        transform: translateY(-1px) scale(1.01);
        box-shadow: 0 18px 32px rgba(147,118,255,0.32);
        filter: brightness(1.04);
      }

      .submit-btn:active {
        transform: translateY(1px) scale(0.99);
      }

      .wish-lantern {
        position: absolute;
        width: 210px;
        height: 260px;
        z-index: 4;
        pointer-events: none;
        will-change: transform, opacity;
      }

      .wish-lantern::before {
        content: "";
        position: absolute;
        left: 50%;
        top: 0;
        width: 3px;
        height: 28px;
        transform: translateX(-50%);
        background: linear-gradient(180deg, rgba(255,255,255,0.9), rgba(178,198,255,0.82));
      }

      .wish-lantern::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: -2px;
        width: 12px;
        height: 12px;
        transform: translateX(-50%);
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #fff5c0 0%, var(--flame) 26%, #ff9d37 62%, rgba(255,157,54,0.7) 100%);
        box-shadow: 0 0 20px rgba(255, 180, 74, 0.8), 0 0 28px rgba(255, 151, 66, 0.72);
      }

      .wish-lantern .lantern-body {
        position: absolute;
        left: 50%;
        top: 20px;
        width: 100%;
        height: 166px;
        transform: translateX(-50%);
        background: linear-gradient(180deg, #fffce8 0%, #f8e59c 16%, #f0c76d 50%, #df8f44 100%);
        border: 1px solid rgba(255, 236, 171, 0.95);
        border-radius: 46% 46% 42% 42% / 30% 30% 60% 60%;
        box-shadow: inset 0 0 24px rgba(255,255,255,0.36), 0 12px 30px rgba(255,200,95,0.2);
        clip-path: polygon(14% 0%, 86% 0%, 100% 15%, 97% 100%, 3% 100%, 0% 15%);
      }

      .wish-lantern .lantern-body::before {
        content: "";
        position: absolute;
        inset: 18px 18px 20px;
        border-radius: 48% 48% 52% 52% / 36% 36% 58% 58%;
        background:
          linear-gradient(90deg, rgba(255,255,255,0.18), rgba(255,255,255,0), rgba(255,255,255,0.12)),
          repeating-linear-gradient(
            90deg,
            rgba(133, 83, 17, 0.08) 0,
            rgba(133, 83, 17, 0.08) 2px,
            rgba(255,255,255,0) 2px,
            rgba(255,255,255,0) 8px
          );
      }

      .wish-lantern .lantern-body span {
        position: absolute;
        inset: 30px 18px 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-size: 0.9rem;
        line-height: 1.5;
        color: rgba(65, 35, 22, 0.82);
        font-weight: 700;
        letter-spacing: 0.08em;
        text-shadow: 0 1px 0 rgba(255,255,255,0.35);
        word-break: break-word;
        z-index: 1;
      }

      .shake {
        animation: input-shake 0.35s ease-in-out;
      }

      @keyframes input-shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-6px); }
        50% { transform: translateX(5px); }
        75% { transform: translateX(-4px); }
      }

      @media (max-width: 700px) {
        .wish-form-wrap {
          width: min(100% - 18px, 700px);
        }

        form {
          flex-direction: column;
          align-items: stretch;
        }

        .submit-btn {
          width: 100%;
          min-width: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="scene" id="scene">
      <div class="stars" id="stars"></div>

      <div class="wish-form-wrap">
        <form id="wishForm" novalidate>
          <div class="glass-field">
            <input id="wishInput" type="text" maxlength="80" placeholder="寫下你的心願..." aria-label="你的心願" />
          </div>
          <button class="submit-btn" type="submit">Release Wish</button>
        </form>
      </div>
    </div>

    <script>
      const starsLayer = document.getElementById('stars');
      const scene = document.getElementById('scene');
      const wishForm = document.getElementById('wishForm');
      const wishInput = document.getElementById('wishInput');

      function randomBetween(min, max) {
        return Math.random() * (max - min) + min;
      }

      function createStars() {
        const starCount = 150;
        for (let i = 0; i < starCount; i += 1) {
          const star = document.createElement('span');
          star.className = 'star';
          star.style.left = `${randomBetween(0, 100)}%`;
          star.style.top = `${randomBetween(2, 82)}%`;
          star.style.setProperty('--duration', `${randomBetween(2.2, 5.5)}s`);
          star.style.setProperty('--delay', `${randomBetween(0, 3.2)}s`);
          star.style.width = `${randomBetween(1.2, 3.0)}px`;
          star.style.height = star.style.width;
          starsLayer.appendChild(star);
        }
      }

      function createBackgroundLanterns() {
        const lanternCount = 10;
        for (let i = 0; i < lanternCount; i += 1) {
          const lantern = document.createElement('div');
          lantern.className = 'lantern-bg';
          lantern.style.setProperty('--size', `${randomBetween(24, 52)}px`);
          lantern.style.setProperty('--x', `${randomBetween(5, 92)}%`);
          lantern.style.setProperty('--y', `${randomBetween(10, 58)}%`);
          lantern.style.setProperty('--scale', `${randomBetween(0.8, 1.35)}`);
          lantern.style.setProperty('--duration', `${randomBetween(5.5, 9.5)}s`);
          lantern.style.opacity = String(randomBetween(0.46, 0.84));

          const shape = document.createElement('div');
          shape.className = 'lantern-shape';
          lantern.appendChild(shape);

          const ribs = document.createElement('div');
          ribs.className = 'ribs';
          lantern.appendChild(ribs);

          scene.appendChild(lantern);
        }
      }

      function createWishLantern(text) {
        const lantern = document.createElement('div');
        lantern.className = 'wish-lantern';

        const body = document.createElement('div');
        body.className = 'lantern-body';

        const message = document.createElement('span');
        message.textContent = text;

        body.appendChild(message);
        lantern.appendChild(body);
        scene.appendChild(lantern);

        const sceneRect = scene.getBoundingClientRect();
        const inputCenterX = wishInput.getBoundingClientRect().left + wishInput.offsetWidth / 2 - sceneRect.left;
        const startX = inputCenterX;
        const startY = window.innerHeight - 90;
        const targetY = randomBetween(90, 240);
        const targetX = clamp(startX + randomBetween(-60, 60), 40, window.innerWidth - 80);
        const duration = 4400;
        const startTime = performance.now();

        function easeOutCubic(t) {
          return 1 - Math.pow(1 - t, 3);
        }

        function animate(now) {
          const elapsed = now - startTime;
          const p = Math.min(elapsed / duration, 1);
          const eased = easeOutCubic(p);
          const sway = Math.sin(p * Math.PI * 1.7) * 14;
          const x = startX + (targetX - startX) * eased + sway;
          const y = startY - (startY - targetY) * eased;
          const scale = 0.78 + eased * 0.52;
          const opacity = p < 0.12 ? p / 0.12 : p > 0.9 ? (1 - p) / 0.1 : 1;

          lantern.style.transform = `translate(${x - startX}px, ${y - startY}px) scale(${scale})`;
          lantern.style.opacity = String(opacity);

          if (p < 1) {
            requestAnimationFrame(animate);
          } else {
            lantern.remove();
          }
        }

        requestAnimationFrame(animate);
      }

      function clamp(value, min, max) {
        return Math.min(Math.max(value, min), max);
      }

      wishForm.addEventListener('submit', (event) => {
        event.preventDefault();

        const message = wishInput.value.trim();
        if (!message) {
          const field = wishInput.parentElement;
          field.classList.remove('shake');
          void field.offsetWidth;
          field.classList.add('shake');
          wishInput.focus();
          return;
        }

        createWishLantern(message);
        wishInput.value = '';
        wishInput.focus();
      });

      createStars();
      createBackgroundLanterns();
    </script>
  </body>
</html>
