<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sky Lantern Wishes</title>
    <style>
      :root {
        --sky-top: #070d1d;
        --sky-mid: #101a36;
        --sky-bottom: #030711;
        --glass-bg: rgba(14, 22, 40, 0.42);
        --glass-border: rgba(197, 223, 255, 0.36);
        --text: #edf4ff;
        --muted: rgba(237, 244, 255, 0.72);
        --gold-1: #ffd67a;
        --gold-2: #f6b55b;
        --paper: #f8e8b8;
        --paper-soft: #f0d58d;
        --paper-deep: #d3b66f;
        --flame: #ffbf45;
        --flame-glow: rgba(255, 182, 72, 0.8);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
        background: linear-gradient(180deg, var(--sky-top), var(--sky-mid) 45%, var(--sky-bottom));
        color: var(--text);
      }

      body {
        min-height: 100vh;
      }

      .scene {
        position: relative;
        width: 100%;
        height: 100vh;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 8%, rgba(145, 166, 255, 0.14), transparent 30%),
          radial-gradient(circle at 80% 22%, rgba(160, 185, 255, 0.10), transparent 28%),
          linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 42%, var(--sky-bottom) 100%);
      }

      .stars {
        position: absolute;
        inset: 0;
        z-index: 0;
      }

      .star {
        position: absolute;
        display: block;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 0 8px rgba(255, 255, 255, 0.75);
        animation: twinkle var(--duration) ease-in-out infinite;
        animation-delay: var(--delay);
        opacity: 0.8;
      }

      @keyframes twinkle {
        0%, 100% {
          transform: scale(0.7);
          opacity: 0.32;
        }
        50% {
          transform: scale(1.8);
          opacity: 1;
        }
      }

      .lantern {
        position: absolute;
        left: var(--x);
        top: var(--y);
        width: var(--size);
        height: calc(var(--size) * 1.65);
        z-index: 1;
        pointer-events: none;
        animation: lantern-drift var(--duration) ease-in-out infinite alternate;
        opacity: 0.7;
      }

      .lantern::before {
        content: "";
        position: absolute;
        left: 50%;
        top: -16px;
        width: 2px;
        height: 24px;
        transform: translateX(-50%);
        background: linear-gradient(180deg, rgba(255,255,255,0.18), rgba(170,186,255,0.7));
      }

      .lantern::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: -8px;
        width: 12px;
        height: 12px;
        transform: translateX(-50%);
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #fff2b0 0%, var(--flame) 26%, #ff9f3d 58%, rgba(255, 143, 63, 0.6) 100%);
        box-shadow: 0 0 20px rgba(255, 167, 58, 0.85), 0 0 30px rgba(255, 178, 71, 0.6);
      }

      .lantern-body {
        position: absolute;
        left: 50%;
        top: 0;
        width: 100%;
        height: calc(100% - 10px);
        transform: translateX(-50%);
        background: linear-gradient(180deg, #fff8d6 0%, #f7d576 18%, #f2b04f 48%, #e98b46 100%);
        border: 1px solid rgba(255, 239, 183, 0.82);
        clip-path: polygon(18% 0%, 82% 0%, 100% 12%, 94% 100%, 6% 100%, 0% 12%);
        box-shadow: inset 0 0 18px rgba(255,255,255,0.38), 0 8px 26px rgba(255, 177, 64, 0.22);
      }

      .lantern-body::before {
        content: "";
        position: absolute;
        inset: 10px 14px 16px;
        border-radius: 44% 44% 48% 48% / 42% 42% 56% 56%;
        background:
          linear-gradient(90deg, rgba(255,255,255,0.22), rgba(255,255,255,0.06), rgba(255,255,255,0.12)),
          repeating-linear-gradient(
            90deg,
            rgba(188, 112, 35, 0.075) 0,
            rgba(188, 112, 35, 0.075) 2px,
            rgba(255,255,255,0) 2px,
            rgba(255,255,255,0) 7px
          );
      }

      @keyframes lantern-drift {
        0% {
          transform: translate3d(0, 0, 0) rotate(-5deg) scale(var(--scale, 1));
        }
        100% {
          transform: translate3d(16px, -10px, 0) rotate(5deg) scale(var(--scale, 1));
        }
      }

      .wish-form-wrap {
        position: absolute;
        left: 50%;
        bottom: 28px;
        transform: translateX(-50%);
        z-index: 5;
        width: min(760px, calc(100% - 28px));
      }

      form {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
      }

      .glass-field {
        position: relative;
        flex: 1;
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        border-radius: 18px;
        box-shadow: 0 14px 34px rgba(12, 18, 34, 0.28), inset 0 1px 10px rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
      }

      input {
        width: 100%;
        border: none;
        outline: none;
        background: transparent;
        color: var(--text);
        font-size: clamp(1rem, 1.4vw, 1.15rem);
        padding: 18px 20px;
        border-radius: 18px;
      }

      input::placeholder {
        color: var(--muted);
      }

      .submit-btn {
        position: relative;
        border: none;
        border-radius: 18px;
        background: linear-gradient(135deg, rgba(255, 210, 122, 0.98), rgba(191, 136, 255, 0.9));
        color: #171d2e;
        font-weight: 700;
        letter-spacing: 0.08em;
        padding: 18px 24px;
        min-width: 160px;
        cursor: pointer;
        box-shadow: 0 12px 24px rgba(147, 118, 255, 0.28);
        transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
      }

      .submit-btn:hover {
        transform: translateY(-1px) scale(1.01);
        box-shadow: 0 18px 32px rgba(147, 118, 255, 0.32);
        filter: brightness(1.04);
      }

      .submit-btn:active {
        transform: translateY(1px) scale(0.99);
      }

      .wish-lantern {
        position: absolute;
        width: 190px;
        height: 220px;
        z-index: 4;
        pointer-events: none;
        will-change: transform, opacity;
      }

      .wish-lantern::before {
        content: "";
        position: absolute;
        left: 50%;
        top: 2px;
        width: 3px;
        height: 28px;
        transform: translateX(-50%);
        background: linear-gradient(180deg, rgba(255,255,255,0.9), rgba(190,202,255,0.82));
      }

      .wish-lantern::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: 0;
        width: 12px;
        height: 12px;
        transform: translateX(-50%);
        border-radius: 50%;
        background: radial-gradient(circle at 40% 35%, #fff4b8 0%, var(--flame) 28%, #ff9d38 62%, rgba(255, 143, 63, 0.7) 100%);
        box-shadow: 0 0 18px rgba(255, 190, 74, 0.8), 0 0 28px rgba(255, 165, 58, 0.75);
      }

      .wish-lantern .lantern-body {
        position: absolute;
        left: 50%;
        top: 18px;
        width: 100%;
        height: 126px;
        transform: translateX(-50%);
        background: linear-gradient(180deg, #fff9dc 0%, #fce2a4 18%, #f3b862 52%, #e88e3d 100%);
        border: 1px solid rgba(255, 236, 173, 0.9);
        box-shadow: inset 0 0 18px rgba(255,255,255,0.34), 0 12px 28px rgba(255, 182, 78, 0.28);
      }

      .wish-lantern .lantern-body::before {
        content: "";
        position: absolute;
        inset: 12px 18px 18px;
        border-radius: 48% 48% 52% 52% / 42% 42% 56% 56%;
        background:
          linear-gradient(90deg, rgba(255,255,255,0.18), rgba(255,255,255,0), rgba(255,255,255,0.12)),
          repeating-linear-gradient(
            90deg,
            rgba(160, 94, 26, 0.08) 0,
            rgba(160, 94, 26, 0.08) 2px,
            rgba(255,255,255,0) 2px,
            rgba(255,255,255,0) 7px
          );
      }

      .wish-lantern .lantern-body span {
        position: absolute;
        inset: 32px 16px 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-size: 0.9rem;
        line-height: 1.45;
        color: rgba(44, 28, 16, 0.8);
        font-weight: 700;
        letter-spacing: 0.06em;
        text-shadow: 0 1px 0 rgba(255, 255, 255, 0.35);
        word-break: break-word;
        z-index: 1;
      }

      .shake {
        animation: input-shake 0.35s ease-in-out;
      }

      @keyframes input-shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-6px); }
        50% { transform: translateX(5px); }
        75% { transform: translateX(-4px); }
      }

      @media (max-width: 700px) {
        .wish-form-wrap {
          width: min(100% - 18px, 700px);
        }

        form {
          flex-direction: column;
          align-items: stretch;
        }

        .submit-btn {
          width: 100%;
          min-width: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="scene" id="scene">
      <div class="stars" id="stars"></div>

      <div class="wish-form-wrap">
        <form id="wishForm" novalidate>
          <div class="glass-field">
            <input id="wishInput" type="text" maxlength="80" placeholder="寫下你的心願..." aria-label="你的心願" />
          </div>
          <button class="submit-btn" type="submit">Release Wish</button>
        </form>
      </div>
    </div>

    <script>
      const starsLayer = document.getElementById('stars');
      const scene = document.getElementById('scene');
      const wishForm = document.getElementById('wishForm');
      const wishInput = document.getElementById('wishInput');

      function randomBetween(min, max) {
        return Math.random() * (max - min) + min;
      }

      function createStars() {
        const starCount = 150;
        for (let i = 0; i < starCount; i += 1) {
          const star = document.createElement('span');
          star.className = 'star';
          star.style.left = `${randomBetween(0, 100)}%`;
          star.style.top = `${randomBetween(2, 82)}%`;
          star.style.setProperty('--duration', `${randomBetween(2.2, 5.5)}s`);
          star.style.setProperty('--delay', `${randomBetween(0, 3.2)}s`);
          star.style.width = `${randomBetween(1.2, 3)}px`;
          star.style.height = star.style.width;
          starsLayer.appendChild(star);
        }
      }

      function createBackgroundLanterns() {
        const lanternCount = 10;

        for (let i = 0; i < lanternCount; i += 1) {
          const lantern = document.createElement('div');
          lantern.className = 'lantern';
          lantern.style.setProperty('--size', `${randomBetween(24, 52)}px`);
          lantern.style.setProperty('--x', `${randomBetween(5, 92)}%`);
          lantern.style.setProperty('--y', `${randomBetween(10, 58)}%`);
          lantern.style.setProperty('--scale', `${randomBetween(0.8, 1.35)}`);
          lantern.style.setProperty('--duration', `${randomBetween(4.8, 8.8)}s`);
          lantern.style.opacity = String(randomBetween(0.42, 0.82));

          const body = document.createElement('div');
          body.className = 'lantern-body';
          lantern.appendChild(body);

          scene.appendChild(lantern);
        }
      }

      function createWishLantern(text) {
        const lantern = document.createElement('div');
        lantern.className = 'wish-lantern';

        const body = document.createElement('div');
        body.className = 'lantern-body';

        const message = document.createElement('span');
        message.textContent = text;

        body.appendChild(message);
        lantern.appendChild(body);
        scene.appendChild(lantern);

        const sceneRect = scene.getBoundingClientRect();
        const inputCenterX = wishInput.getBoundingClientRect().left + wishInput.offsetWidth / 2 - sceneRect.left;
        const startX = inputCenterX;
        const startY = window.innerHeight - 90;
        const targetY = randomBetween(90, 220);
        const targetX = clamp(startX + randomBetween(-80, 80), 40, window.innerWidth - 80);
        const duration = 4200;
        const startTime = performance.now();

        function easeOutCubic(t) {
          return 1 - Math.pow(1 - t, 3);
        }

        function animate(now) {
          const elapsed = now - startTime;
          const p = Math.min(elapsed / duration, 1);
          const eased = easeOutCubic(p);
          const drift = Math.sin(p * Math.PI * 2.2) * 18;
          const x = startX + (targetX - startX) * eased + drift;
          const y = startY - (startY - targetY) * eased;
          const scale = 0.76 + eased * 0.52;
          const opacity = p < 0.12 ? p / 0.12 : p > 0.9 ? (1 - p) / 0.1 : 1;

          lantern.style.left = '0px';
          lantern.style.top = '0px';
          lantern.style.transform = `translate(${x - startX}px, ${y - startY}px) scale(${scale})`;
          lantern.style.opacity = String(opacity);

          if (p < 1) {
            requestAnimationFrame(animate);
          } else {
            lantern.remove();
          }
        }

        requestAnimationFrame(animate);
      }

      function clamp(value, min, max) {
        return Math.min(Math.max(value, min), max);
      }

      wishForm.addEventListener('submit', (event) => {
        event.preventDefault();

        const message = wishInput.value.trim();
        if (!message) {
          const field = wishInput.parentElement;
          field.classList.remove('shake');
          void field.offsetWidth;
          field.classList.add('shake');
          wishInput.focus();
          return;
        }

        createWishLantern(message);
        wishInput.value = '';
        wishInput.focus();
      });

      createStars();
      createBackgroundLanterns();
    </script>
  </body>
</html>
