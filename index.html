<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sky Lantern Wishes</title>
    <style>
      :root {
        --sky-top: #0b102b;
        --sky-mid: #131c3e;
        --sky-bottom: #050914;
        --glass-bg: rgba(12, 18, 34, 0.42);
        --glass-border: rgba(178, 210, 255, 0.34);
        --text: #edf4ff;
        --muted: rgba(237, 244, 255, 0.7);
        --accent: #f7d67d;
        --lantern-glow: rgba(255, 187, 94, 0.8);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
        background: linear-gradient(180deg, var(--sky-top), var(--sky-mid) 45%, var(--sky-bottom));
        color: var(--text);
      }

      body {
        min-height: 100vh;
      }

      .scene {
        position: relative;
        width: 100%;
        height: 100vh;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 8%, rgba(154, 168, 255, 0.18), transparent 34%),
          radial-gradient(circle at 30% 25%, rgba(132, 206, 255, 0.12), transparent 30%),
          linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 40%, var(--sky-bottom) 100%);
      }

      .stars {
        position: absolute;
        inset: 0;
        z-index: 0;
      }

      .star {
        position: absolute;
        width: 2px;
        height: 2px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.95);
        box-shadow: 0 0 6px rgba(255, 255, 255, 0.8);
        animation: twinkle var(--duration) ease-in-out infinite;
        animation-delay: var(--delay);
        opacity: 0.85;
      }

      @keyframes twinkle {
        0%, 100% {
          transform: scale(0.7);
          opacity: 0.35;
        }
        50% {
          transform: scale(1.8);
          opacity: 1;
        }
      }

      .lantern {
        position: absolute;
        left: var(--x);
        top: var(--y);
        width: var(--size);
        height: calc(var(--size) * 1.35);
        z-index: 1;
        pointer-events: none;
        animation: gentle-float var(--duration) ease-in-out infinite alternate;
        opacity: 0.7;
      }

      .lantern-cord {
        position: absolute;
        left: 50%;
        top: -18px;
        width: 2px;
        height: 18px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.2), rgba(171, 192, 255, 0.7));
        transform: translateX(-50%);
      }

      .lantern-body {
        position: absolute;
        left: 50%;
        top: 0;
        width: 100%;
        height: calc(100% - 12px);
        transform: translateX(-50%);
        background: linear-gradient(180deg, rgba(255, 255, 205, 0.38), rgba(255, 181, 86, 0.8) 35%, rgba(255, 144, 67, 0.92));
        border: 1px solid rgba(255, 240, 185, 0.78);
        border-radius: 50% 50% 44% 44% / 46% 46% 40% 40%;
        box-shadow:
          0 0 22px rgba(255, 193, 92, 0.5),
          inset 0 0 14px rgba(255, 255, 255, 0.35),
          inset 0 -10px 18px rgba(255, 160, 64, 0.28);
      }

      .lantern-body::before,
      .lantern-body::after {
        content: "";
        position: absolute;
        top: 12%;
        width: 10%;
        height: 42%;
        border-radius: 50%;
        background: rgba(255, 245, 205, 0.55);
      }

      .lantern-body::before { left: 18%; }
      .lantern-body::after { right: 18%; }

      @keyframes gentle-float {
        0% {
          transform: translate3d(0, 0, 0) rotate(-4deg) scale(var(--scale, 1));
        }
        100% {
          transform: translate3d(18px, -8px, 0) rotate(4deg) scale(var(--scale, 1));
        }
      }

      .wish-form-wrap {
        position: absolute;
        left: 50%;
        bottom: 28px;
        transform: translateX(-50%);
        z-index: 5;
        width: min(760px, calc(100% - 28px));
      }

      form {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
      }

      .glass-field {
        position: relative;
        flex: 1;
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        border-radius: 18px;
        box-shadow: 0 14px 34px rgba(12, 18, 34, 0.28), inset 0 1px 10px rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
      }

      input {
        width: 100%;
        border: none;
        outline: none;
        background: transparent;
        color: var(--text);
        font-size: clamp(1rem, 1.4vw, 1.15rem);
        padding: 18px 20px;
        border-radius: 18px;
      }

      input::placeholder {
        color: var(--muted);
      }

      .submit-btn {
        position: relative;
        border: none;
        border-radius: 18px;
        background: linear-gradient(135deg, rgba(255, 210, 122, 0.98), rgba(191, 136, 255, 0.9));
        color: #151b2d;
        font-weight: 700;
        letter-spacing: 0.08em;
        padding: 18px 24px;
        min-width: 160px;
        cursor: pointer;
        box-shadow: 0 12px 24px rgba(147, 118, 255, 0.28);
        transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
      }

      .submit-btn:hover {
        transform: translateY(-1px) scale(1.01);
        box-shadow: 0 18px 32px rgba(147, 118, 255, 0.32);
        filter: brightness(1.04);
      }

      .submit-btn:active {
        transform: translateY(1px) scale(0.99);
      }

      .wish-lantern {
        position: absolute;
        width: 110px;
        height: 150px;
        z-index: 4;
        pointer-events: none;
        will-change: transform, opacity;
      }

      .wish-lantern .lantern-body {
        width: 100%;
        height: 84px;
        top: 18px;
        background: linear-gradient(180deg, rgba(255, 246, 208, 0.9), rgba(255, 179, 86, 0.92) 30%, rgba(255, 115, 84, 0.92));
        border-radius: 52% 52% 44% 44% / 48% 48% 42% 42%;
        border: 1px solid rgba(255, 239, 191, 0.8);
        box-shadow: 0 0 18px rgba(255, 184, 98, 0.56), inset 0 0 12px rgba(255, 255, 255, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 14px 12px;
        overflow: hidden;
      }

      .wish-lantern .lantern-body span {
        display: block;
        width: 100%;
        font-size: 0.84rem;
        line-height: 1.4;
        color: rgba(28, 15, 24, 0.82);
        font-weight: 700;
        letter-spacing: 0.04em;
        text-shadow: 0 1px 0 rgba(255, 255, 255, 0.35);
        word-break: break-word;
      }

      .wish-lantern .lantern-cord {
        position: absolute;
        left: 50%;
        top: 0;
        width: 2px;
        height: 26px;
        transform: translateX(-50%);
        background: linear-gradient(180deg, rgba(255,255,255,0.7), rgba(171,192,255,0.85));
      }

      .wish-lantern .lantern-tail {
        position: absolute;
        left: 50%;
        bottom: 0;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        transform: translateX(-50%);
        background: rgba(255, 184, 98, 0.25);
        filter: blur(6px);
      }

      .shake {
        animation: input-shake 0.35s ease-in-out;
      }

      @keyframes input-shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-6px); }
        50% { transform: translateX(5px); }
        75% { transform: translateX(-4px); }
      }

      @media (max-width: 700px) {
        .wish-form-wrap {
          width: min(100% - 18px, 700px);
        }

        form {
          flex-direction: column;
          align-items: stretch;
        }

        .submit-btn {
          width: 100%;
          min-width: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="scene" id="scene">
      <div class="stars" id="stars"></div>

      <div class="wish-form-wrap">
        <form id="wishForm" novalidate>
          <div class="glass-field">
            <input id="wishInput" type="text" maxlength="80" placeholder="寫下你的心願..." aria-label="你的心願" />
          </div>
          <button class="submit-btn" type="submit">Release Wish</button>
        </form>
      </div>
    </div>

    <script>
      const starsLayer = document.getElementById('stars');
      const scene = document.getElementById('scene');
      const wishForm = document.getElementById('wishForm');
      const wishInput = document.getElementById('wishInput');

      function randomBetween(min, max) {
        return Math.random() * (max - min) + min;
      }

      function createStars() {
        const starCount = 140;
        for (let i = 0; i < starCount; i += 1) {
          const star = document.createElement('span');
          star.className = 'star';
          star.style.left = `${randomBetween(0, 100)}%`;
          star.style.top = `${randomBetween(2, 85)}%`;
          star.style.setProperty('--duration', `${randomBetween(2.2, 5.2)}s`);
          star.style.setProperty('--delay', `${randomBetween(0, 3.2)}s`);
          star.style.width = `${randomBetween(1, 3.2)}px`;
          star.style.height = star.style.width;
          starsLayer.appendChild(star);
        }
      }

      function createBackgroundLanterns() {
        const lanternCount = 9;

        for (let i = 0; i < lanternCount; i += 1) {
          const lantern = document.createElement('div');
          lantern.className = 'lantern';
          lantern.style.setProperty('--size', `${randomBetween(22, 42)}px`);
          lantern.style.setProperty('--x', `${randomBetween(5, 90)}%`);
          lantern.style.setProperty('--y', `${randomBetween(8, 58)}%`);
          lantern.style.setProperty('--scale', `${randomBetween(0.8, 1.35)}`);
          lantern.style.setProperty('--duration', `${randomBetween(4.2, 8.5)}s`);
          lantern.style.opacity = String(randomBetween(0.4, 0.8));

          const cord = document.createElement('div');
          cord.className = 'lantern-cord';
          lantern.appendChild(cord);

          const body = document.createElement('div');
          body.className = 'lantern-body';
          lantern.appendChild(body);

          scene.appendChild(lantern);
        }
      }

      function escapeHTML(str) {
        return str
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function clearInputState() {
        wishInput.parentElement.classList.remove('shake');
      }

      function createWishLantern(text) {
        const lantern = document.createElement('div');
        lantern.className = 'wish-lantern';

        const cord = document.createElement('div');
        cord.className = 'lantern-cord';

        const body = document.createElement('div');
        body.className = 'lantern-body';

        const message = document.createElement('span');
        message.textContent = text;

        const tail = document.createElement('div');
        tail.className = 'lantern-tail';

        body.appendChild(message);
        lantern.appendChild(cord);
        lantern.appendChild(body);
        lantern.appendChild(tail);

        scene.appendChild(lantern);

        const startX = wishInput.getBoundingClientRect().left + wishInput.offsetWidth / 2 - scene.getBoundingClientRect().left;
        const startY = window.innerHeight - 118;
        const targetX = clamp(startX + randomBetween(-220, 220), 40, window.innerWidth - 80);
        const targetY = randomBetween(90, 310);
        const duration = randomBetween(3500, 5000);

        lantern.style.left = `${startX}px`;
        lantern.style.top = `${startY}px`;
        lantern.style.opacity = '0';

        const startTime = performance.now();

        function animate(now) {
          const elapsed = now - startTime;
          const p = Math.min(elapsed / duration, 1);
          const eased = 1 - Math.pow(1 - p, 3);
          const x = startX + (targetX - startX) * eased + Math.sin(p * 9 + Math.random() * 2) * 26;
          const y = startY + (targetY - startY) * eased;
          const drift = Math.sin(p * 12) * 10;
          const scale = 0.75 + eased * 0.55;
          const opacity = p < 0.12 ? p / 0.12 : p > 0.9 ? (1 - p) / 0.1 : 1;

          lantern.style.transform = `translate(${x - startX}px, ${y - startY}px) rotate(${drift}deg) scale(${scale})`;
          lantern.style.opacity = opacity.toFixed(3);

          if (p < 1) {
            requestAnimationFrame(animate);
          } else {
            lantern.remove();
          }
        }

        requestAnimationFrame(animate);
      }

      function clamp(value, min, max) {
        return Math.min(Math.max(value, min), max);
      }

      wishForm.addEventListener('submit', (event) => {
        event.preventDefault();
        clearInputState();

        const message = wishInput.value.trim();
        if (!message) {
          const field = wishInput.parentElement;
          field.classList.remove('shake');
          void field.offsetWidth;
          field.classList.add('shake');
          wishInput.focus();
          return;
        }

        createWishLantern(message);
        wishInput.value = '';
        wishInput.focus();
      });

      createStars();
      createBackgroundLanterns();
    </script>
  </body>
</html>
